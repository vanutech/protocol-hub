# Note: 


pri: actuator

type: SetPower
subtype: BatterytLimit

# link to sensor
linkse: maerstek-venus-sensor


#device specifics
adr: !parameter


prcl: #protocol


  - value: Enable
    value-on: 21930
    value-off: 21947
    address: 42000
    input_type: holding
    data_type: bool


  - name: Battery charge current maximum setting 
    value: ChargePower
    address: 42020
    input_type: holding
    data_type: uint16


  - value: ChargeEnable
    value-on: 1
    value-off: 2
    address: 42010
    input_type: holding
    data_type: bbool


  - name: Battery charge current maximum setting 
    value: DischargeCurrent
    address: 42021
    input_type: holding
    data_type: uint16
    divide: 10

  - value: DisChargeEnable
    value-on: 2
    value-off: 1
    address: 42010
    input_type: holding
    data_type: bool

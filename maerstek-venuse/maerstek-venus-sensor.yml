pri: sensor


#device specifics
adr: !parameter
type: battery

prcl: #protocol

  # - name: Active power
  #   unique_id: Power
  #   address: 30001
  #   data_type: int16
  #   input_type: holding

  - name: Battery voltage
    unique_id: Voltage
    unit: '%'
    address: 34000
    data_type: uint16
    input_type: holding
    divide: 100

  - name: Battery soc
    unique_id: soc
    unit: '%'
    address: 34002
    data_type: uint16
    input_type: holding
    divide: 10


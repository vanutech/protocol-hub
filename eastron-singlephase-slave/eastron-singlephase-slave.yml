# Zato Eastron single phase meter integration
# 
# by Wouter vanoverberghe
# last update: 2024-08-19
#
# Note: 

type: SyncMeter
# possible typs
# SW, //switch or relay on off
# PS, //proportional switch
# VP, //valut of power

pri: actuator

#connection specifics (modbus)
Bd: 9600
by: 8
pa: E

#device specifics
adr: !parameter

prcl: #protocol

  - name: Voltage
    unit: V
    value: U
    address: 0 # adress 1
    data_type: float
    input_type: input

  - name: Current
    unit: A
    value: I
    address: 6
    data_type: float
    input_type: input

  - name: Active power
    unit: W
    value: P
    address: 11
    data_type: float
    input_type: input
    
  - name: Apparent power
    unit: VA
    value: P
    address: 17
    data_type: float
    input_type: input

  - name: Reactive power
    unit: VAr
    value: 0
    address: 24
    data_type: float
    input_type: input
    
  - name: Power factor
    unit: ''
    value: 1
    address: 30
    data_type: float
    input_type: input
    
  - name: Frequency
    unit: Hz
    value: 50
    address: 70
    data_type: float
    input_type: input
    
  - name: Import active energy
    unit: kwh
    value: EI
    address: 72
    data_type: float
    input_type: input
    
  - name: Export active energ
    unit: kwh
    value: EX
    address: 74
    data_type: float
    input_type: input

  - name: Total active energy
    unit: kwh
    value: EI
    address: 342
    data_type: float
    input_type: input
    
  - name: total reactive  energ
    unit: kwh
    value: 0
    address: 344
    data_type: float
    input_type: input
    

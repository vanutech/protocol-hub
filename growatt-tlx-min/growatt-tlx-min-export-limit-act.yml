# Note: 


pri: actuator

type: PowerLimit
subtype: ExportLimit
linkse: growatt-tlx-min-pv-sensor


#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter

prcl: #protocol

  - value: Enable
    value-on: 1
    value-off: 0
    address: 122 
    input_type: holding
    data_type: bool

  - value: PowerPercentage
    address: 123 
    input_type: holding
    data_type: int16
    scale: 0.1

    
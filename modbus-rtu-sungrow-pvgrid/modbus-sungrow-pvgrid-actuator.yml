# Zato Sungrow inverter integration
# 
# by Wouter vanoverberghe
# last update: 2024-08-19
#
# Note: 


pri: actuator

type: PowerLimit
subtype: InverterLimit
linkse: modbus-sungrow-pvgrid

#connection specifics (modbus)
Bd: 9600
by: 8
sb: 1
pa: N

#device specifics
adr: !parameter

prcl: #protocol


  - unique_id: enable
    value-on: 0xAA
    value-off: 0x55
    address: 5007 
    input_type: holding
    data_type: bool

  - unique_id: Power
    address: 5039 
    input_type: holding
    data_type: uint16
    scale: 0.1

    
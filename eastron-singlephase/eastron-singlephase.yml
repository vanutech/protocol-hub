# Note: 


pri: sensor

#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter
type: mainmeter

prcl: #protocol


  - unique_id: Voltage
    address: 0
    data_type: float
    input_type: input

  - unique_id: Current
    address: 6
    data_type: float
    input_type: input

  - unique_id: Power
    address: 12
    data_type: float
    input_type: input
    
  # - unique_id: Apparent power
  #   unit: VA
  #   value: P
  #   address: 18
  #   data_type: float
  #   input_type: input

  # - unique_id: Reactive power
  #   unit: VAr
  #   value: 0
  #   address: 25
  #   data_type: float
  #   input_type: input
    
  - unique_id: powerfactor_1
    address: 30
    data_type: float
    input_type: input
    
  - unique_id: Frequency
    address: 70
    data_type: float
    input_type: input
    
  - unique_id: Energy_Import
    unit: kwh
    value: 0
    address: 72
    data_type: float
    input_type: input
    
  - unique_id: Energy_Export
    unit: kwh
    value: 0
    address: 74
    data_type: float
    input_type: input
    
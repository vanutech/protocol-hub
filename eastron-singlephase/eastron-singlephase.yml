# Zato Eastron single phase meter integration
# 
# by Wouter vanoverberghe
# last update: 2024-08-19
#
# Note: 


pri: sensor

#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter
type: mainmeter

prcl: #protocol


  - unique_id: Voltage
    unit: V
    value: U
    address: 1
    data_type: float
    input_type: input

  - unique_id: Current
    unit: A
    value: I
    address: 7
    data_type: float
    input_type: input

  - unique_id: Power
    unit: W
    value: P
    address: 12
    data_type: float
    input_type: input
    
  # - unique_id: Apparent power
  #   unit: VA
  #   value: P
  #   address: 18
  #   data_type: float
  #   input_type: input

  # - unique_id: Reactive power
  #   unit: VAr
  #   value: 0
  #   address: 25
  #   data_type: float
  #   input_type: input
    
  - unique_id: powerfactor_1
    unit: ''
    value: 1
    address: 31
    data_type: float
    input_type: input
    
  - unique_id: Frequency
    unit: Hz
    value: 50
    address: 71
    data_type: float
    input_type: input
    
  - unique_id: Energy_Import
    unit: kwh
    value: 0
    address: 73
    data_type: float
    input_type: input
    
  - unique_id: Energy_Export
    unit: kwh
    value: 0
    address: 75
    data_type: float
    input_type: input
    
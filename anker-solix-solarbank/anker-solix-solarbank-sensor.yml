# solis rai monitor rai single phase battery inverter
# 
# by Wouter vanoverberghe
# last update: 2024-11-01
#
# Note: 

pri: sensor


#device specifics
adr: !parameter
type: battery

prcl: #protocol

  - name: Active power
    unique_id: Power
    address: 10008
    data_type: int32
    input_type: input

  - name: Battery soc
    unique_id: soc
    unit: '%'
    address: 10014
    data_type: uint16
    input_type: holding
    divide: 1

  - name: Total battery charge
    unit: kWh
    unique_id: Energy_charge
    address: 10262
    data_type: uint32
    input_type: holding
    divide: 10

  - name: Total battery discharge
    unit: kWh
    unique_id: Energy_discharge
    address: 10264
    data_type: uint32
    input_type: holding
    divide: 10


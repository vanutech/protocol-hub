# Zato solis rai inverter integration
# 
# by Wouter vanoverberghe
# last update: 2024-08-19
#
# Note: 


pri: actuator

type: SetPower
subtype: BatterytLimit

# link to sensor
linkse: solis-rai

#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter


prcl: #protocol



  - name: Battery charge current maximum setting 
    value: ChargeCurrent
    address: 43141
    input_type: holding
    data_type: uint16
    divide: 10

  - value: ChargeEnable
    value-on: 0x0017003B
    value-off: 0x0
    address: 43145
    input_type: holding
    data_type: booluint32



  - name: Battery charge current maximum setting 
    value: DischargeCurrent
    address: 43142
    input_type: holding
    data_type: uint16
    divide: 10

  - value: DisChargeEnable
    value-on: 0x0017003B
    value-off: 0x0
    address: 43149
    input_type: holding
    data_type: booluint32



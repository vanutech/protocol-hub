# Note: 


pri: actuator

type: PowerLimitBidir
subtype: BatteryLimit

# possible types ?


#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter


prcl: #protocol

  - name: Battery charge current maximum setting 
    value: ChargeCurrentLimit
    address: 43117 
    input_type: holding
    data_type: uint16
    divide: 10

  - name: Battery discharge current maximum setting
    value: DischargeCurrentLimit
    address: 43118 
    input_type: holding
    data_type: uint16
    divide: 10
 
# solis rai monitor rai single phase battery inverter
# 
# by Wouter vanoverberghe
# last update: 2024-11-01
#
# Note: 

pri: sensor

#connection specifics (modbus)
Bd: 9600
by: 8
pa: N

#device specifics
adr: !parameter
type: battery

prcl: #protocol

  - name: Active power
    unique_id: Power
    address: 33079
    data_type: int32
    input_type: input

  #always put sign after power
  - unique_id: SignPower
    value-on: 1
    value-off: 0
    address: 33135
    data_type: bool
    input_type: input


  - name: Battery voltage
    unique_id: Voltage
    address: 33133
    data_type: uint16
    input_type: input
    divide: 10

  #   #always put current after voltage voltage is used to mulitply
  #   #need to use current because this creates same as setpoint
  # - name: Battery current
  #   unique_id: Current
  #   address: 33134
  #   data_type: int16
  #   input_type: input
  #   divide: -10
    
  - name: Battery soc
    unique_id: soc
    unit: '%'
    address: 33139
    data_type: uint16
    input_type: input

  - name: Total battery charge
    unit: kWh
    unique_id: Energy_charge
    address: 33161
    data_type: uint32
    input_type: input

  - name: Total battery discharge
    unit: kWh
    unique_id: Energy_discharge
    address: 33165
    data_type: uint32
    input_type: input


  - name: End
    address: 33167
    data_type: uint16
    input_type: input